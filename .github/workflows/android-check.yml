name: Android development checks

on:
  push:
    branches: [codex/ui-optimization-experiment]
    paths: ['mobile/**', 'src/shared/**', '.github/workflows/android-check.yml']
  pull_request:
    branches: [codex/android-port]
    paths: ['mobile/**', 'src/shared/**', '.github/workflows/android-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu image already contains SDK 36 and build-tools 36.0.0.
      # Avoid a second SDK/bootstrap/license network pass before compilation.
      - name: Use preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Check bounded-memory complete JSON and ZIP backups above 64MiB
        run: node scripts/check-backup-stream.mjs
      - name: Check disk-backed CSV and XLSX streams above 64MiB
        run: node scripts/check-table-stream.mjs
      - name: Check one complete 70MiB record through CSV, ZIP64, restore and editing
        run: node scripts/check-single-record-stream.mjs
      - name: Check native staging, strict restore and low-space failures
        run: |
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/coc-org-json.jar"
          JSON_JAR="$RUNNER_TEMP/coc-org-json.jar" node scripts/check-native.mjs
      - name: Generate complete public native capacity fixture
        run: |
          node scripts/native-capacity-fixture.mjs
          mkdir -p android/app/src/androidTest/assets
          cp android/app/build/public-capacity/native-sample.json android/app/src/androidTest/assets/public-capacity.json
          node scripts/native-capacity-webview.mjs
      - run: pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Prepare unsigned release for local signing
        run: |
          mkdir -p android/app/build/outputs/local-signing
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/local-signing/app-release-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/local-signing/app-release-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/app/build/outputs/local-signing/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: coc-logbook-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coc-logbook-native-instrumentation-tests
          path: mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coc-logbook-unsigned-release-for-local-signing
          path: mobile/android/app/build/outputs/local-signing/*
          retention-days: 7

  native-capacity:
    needs: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coc-logbook-debug-apk
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: coc-logbook-native-instrumentation-tests
          path: tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android SQLite capacity and transaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disk-size: 12G
          heap-size: 256M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 12288
          script: |
            adb install app/app-debug.apk
            adb install tests/app-debug-androidTest.apk
            adb shell df -k /data > native-capacity-environment.txt
            adb shell getprop dalvik.vm.heapsize >> native-capacity-environment.txt
            adb shell am instrument -w -e class coc.logbook.CapacityDatabaseTest,coc.logbook.IndexedPressureTest,coc.logbook.CapacityWebViewTest,coc.logbook.TableStreamTest coc.logbook.debug53.test/androidx.test.runner.AndroidJUnitRunner | tee native-capacity.txt
            adb logcat -d -s System.out:I > native-capacity-public.log
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed|shortMsg=' native-capacity.txt
            grep -E 'OK \([0-9]+ tests?\)' native-capacity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-public-native-capacity-evidence
          path: |
            native-capacity.txt
            native-capacity-public.log
            native-capacity-environment.txt
          if-no-files-found: ignore
