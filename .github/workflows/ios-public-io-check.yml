name: iOS complete public I/O
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-io-feedback:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm ios:sync && node scripts/check-release-web.mjs
      - run: python3 scripts/test-character-import-acceptance.py && python3 scripts/test-table-import-acceptance.py
      - run: python3 scripts/test-ios-ci-scheduling.py
      # Required by ios-check.yml on the same source revision. Standalone manual
      # execution remains available for feedback and never replaces full CI.
      - name: Exercise every complete public I/O assertion in a fresh simulator
        run: python3 scripts/ios-public-io-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-additional-complete-io-evidence
          path: |
            mobile/ios/build/ios-public-io-diagnostic-*.json
            mobile/ios/build/public-io-diagnostic-build.log
          if-no-files-found: ignore
