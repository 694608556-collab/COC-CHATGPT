name: iOS complete public I/O feedback
on:
  push:
    branches: [codex/ios-ipa-adaptation]
    paths: ['mobile/tests/public-io-webview.ts', 'mobile/tests/ios-public-io.ts', 'mobile/scripts/ios-public-io-check.py', '.github/workflows/ios-public-io-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-io-feedback:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm ios:sync && node scripts/check-release-web.mjs
      # Capture the actual WebKit canvas PNG header with complete I/O feedback.
      # The existing complete ios-check.yml stays
      # mandatory, including every capacity, startup, system UI and I/O gate.
      - name: Exercise complete public I/O in another fresh simulator
        run: python3 scripts/ios-public-io-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-additional-complete-io-evidence
          path: |
            mobile/ios/build/ios-public-io-diagnostic-*.json
            mobile/ios/build/public-io-diagnostic-build.log
          if-no-files-found: ignore
