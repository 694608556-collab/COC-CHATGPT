name: iOS IPA development
on:
  push:
    branches: [codex/ios-ipa-adaptation]
    paths:
      [
        'mobile/**',
        '!mobile/*.md',
        '!mobile/releases/**',
        'src/shared/**',
        '.github/workflows/ios-check.yml',
        '.github/workflows/ios-public-io-check.yml'
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # A fresh runner performs every complete I/O assertion in parallel with the
  # native/UI suites, avoiding a second simulator on their exhausted host.
  complete-public-io:
    uses: ./.github/workflows/ios-public-io-check.yml
  ios:
    runs-on: xcode-27
    # Expanded UI suites retain their own 900s process limits and exact 10s
    # assertions. Leave room for all required groups plus the scale fixture.
    timeout-minutes: 65
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Check strict first and repeated import timing gates
        run: python3 scripts/test-character-import-acceptance.py && python3 scripts/test-table-import-acceptance.py
      - name: Check required parallel iOS acceptance schedule
        run: python3 scripts/test-ios-ci-scheduling.py
      - name: Check iOS native transactions, bodies and local archive protection
        run: |
          node scripts/ios-native-fixture.mjs
          bash scripts/build-table-kernel.sh
          node scripts/check-table-kernel.mjs ios/build/table-kernel-host/coc-table-kernel-probe
          swiftc -swift-version 5 -import-objc-header native/table-kernel/table-kernel.h ios/App/App/LogbookStore.swift ios/App/App/LogbookValidation.swift ios/App/App/LogbookMutations.swift ios/App/App/LogbookArchive.swift ios/App/App/LogbookBackup.swift ios/App/App/LogbookTable.swift scripts/ios-native-tests.swift scripts/ios-scale-tests.swift scripts/ios-backup-tests.swift scripts/ios-capacity-tests.swift scripts/ios-capacity-fetch-tests.swift scripts/ios-table-stream-tests.swift ios/build/table-kernel-host/libcoc_table_kernel.a -Xlinker -lc++ -lz -o ios/build/native-checks
          ios/build/native-checks ios/build/native-sample.json
      - name: Check bounded-memory complete JSON and ZIP backups above 64MiB
        run: node scripts/check-backup-stream.mjs
      - name: Check disk-backed CSV and XLSX streams above 64MiB
        run: node scripts/check-table-stream.mjs
      - name: Check one complete 70MiB record through CSV, ZIP64, restore and editing
        run: node scripts/check-single-record-stream.mjs
      - run: pnpm ios:sync && node scripts/check-release-web.mjs
      - name: Build device arm64 IPA without Apple credentials
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coc-logbook-ios-arm64-unsigned-ipa
          path: |
            mobile/ios/build/*.ipa
            mobile/ios/build/*.sha256
            mobile/ios/build/INSTALL-IPA.txt
            mobile/ios/build/xcode-version.txt
          retention-days: 14
      - name: Check fresh native WKWebView startup in cloud simulator
        run: |
          gem install --user-install xcodeproj --no-document
          node scripts/coc7-public-fixture.mjs
          python3 scripts/ios-simulator-smoke.py --required-public-io-job complete-public-io
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-picker-ui-evidence
          path: |
            mobile/ios/build/picker-ui.log
            mobile/ios/build/picker-ui*.xcresult
            mobile/ios/build/picker-attachments
            mobile/ios/build/picker-manifest-*.json
            mobile/ios/build/ios-name-events*.jsonl
            mobile/ios/build/ios-name-trace-missing*.json
            mobile/ios/build/ios-name-trace-disabled*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-startup-evidence
          path: |
            mobile/ios/build/ios-initial-screen.png
            mobile/ios/build/ios-capacity-result.json
            mobile/ios/build/ios-smoke-result.json
            mobile/ios/build/simulator-environment.json
            mobile/ios/build/screenshot-error.json
            mobile/ios/build/simulator-failure.json
            mobile/ios/build/ios-scale-result.json
            mobile/ios/build/ios-public-io-result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-diagnostics
          path: mobile/ios/build/*.log
          if-no-files-found: ignore
  ios-complete:
    needs: [ios, complete-public-io]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require native, system UI and complete I/O success
        env:
          NATIVE_RESULT: ${{ needs.ios.result }}
          IO_RESULT: ${{ needs.complete-public-io.result }}
        run: test "$NATIVE_RESULT" = success && test "$IO_RESULT" = success
